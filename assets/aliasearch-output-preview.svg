      .heading { fill:#172620; font-size:34px; font-weight:730; }
      .muted { fill:#6A7972; font-size:16px; }
      .head { fill:#52645C; font-size:13px; font-weight:800; letter-spacing:.7px; }
      .name { fill:#1B2A24; font-size:18px; font-weight:700; }
      .body { fill:#52645C; font-size:15px; }
      .small { fill:#738078; font-size:13px; }
      .good { fill:#276D59; font-size:13px; font-weight:800; }
