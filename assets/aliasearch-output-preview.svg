<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Aliasearch prospect output</title>
  <desc id="desc">Demo prospect shortlist with fit, contact route, evidence, and tailored message fields.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
