<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Aliasearch prospect research workflow</title>
  <desc id="desc">A four-stage editorial workflow: brief, discover, verify, and deliver.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAF8"/>
      <stop offset="1" stop-color="#EEF3F0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#14231D" flood-opacity=".08"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { fill:#357061; font-size:15px; font-weight:750; letter-spacing:2.2px; }
      .heading { fill:#172620; font-size:42px; font-weight:720; }
      .sub { fill:#607068; font-size:19px; }
      .num { fill:#FFFFFF; font-size:15px; font-weight:800; }
      .card-title { fill:#172620; font-size:25px; font-weight:700; }
      .body { fill:#617169; font-size:17px; }
      .label { fill:#355D52; font-size:14px; font-weight:700; letter-spacing:.6px; }
      .line { stroke:#8DA099; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; fill:none; }
    </style>
  </defs>

  <rect width="1440" height="720" rx="28" fill="url(#bg)"/>
  <circle cx="1320" cy="88" r="170" fill="#DCEAE4" opacity=".58"/>
  <circle cx="88" cy="692" r="180" fill="#F0E4D8" opacity=".62"/>

  <text x="72" y="78" class="eyebrow">ALIASEARCH · PROSPECT RESEARCH</text>
  <text x="72" y="132" class="heading">From a business offer to a shortlist you can trust.</text>
  <text x="72" y="171" class="sub">One brief. Broad discovery. Evidence-backed decisions. Clear next contact.</text>

  <path d="M258 404H376M602 404H720M946 404H1064" stroke="#9AB0A8" stroke-width="3" stroke-linecap="round"/>
  <path d="M366 396l12 8-12 8M710 396l12 8-12 8M1054 396l12 8-12 8" class="line"/>

  <g filter="url(#shadow)">
    <rect x="72" y="230" width="286" height="356" rx="18" fill="#FFFFFF" stroke="#DCE5E1"/>
    <rect x="416" y="230" width="286" height="356" rx="18" fill="#FFFFFF" stroke="#DCE5E1"/>
    <rect x="760" y="230" width="286" height="356" rx="18" fill="#FFFFFF" stroke="#DCE5E1"/>
    <rect x="1104" y="230" width="264" height="356" rx="18" fill="#173B31"/>
  </g>

  <circle cx="112" cy="274" r="20" fill="#367764"/>
  <text x="112" y="280" text-anchor="middle" class="num">01</text>
  <text x="144" y="282" class="card-title">Brief</text>
  <text x="96" y="332" class="body">Offer and proof</text>
  <text x="96" y="365" class="body">Ideal buyer or user</text>
  <text x="96" y="398" class="body">Geography and count</text>
  <text x="96" y="431" class="body">Exclusions and channels</text>
  <rect x="96" y="474" width="160" height="38" rx="19" fill="#E7F1ED"/>
  <text x="176" y="499" text-anchor="middle" class="label">CONTEXT LOCKED</text>
  <path d="M96 545h194" stroke="#DCE5E1"/>
  <text x="96" y="568" class="body" font-size="14">No silent assumptions</text>

  <circle cx="456" cy="274" r="20" fill="#367764"/>
  <text x="456" y="280" text-anchor="middle" class="num">02</text>
  <text x="488" y="282" class="card-title">Discover</text>
  <rect x="440" y="326" width="106" height="42" rx="8" fill="#F2F5F3"/>
  <rect x="558" y="326" width="120" height="42" rx="8" fill="#F2F5F3"/>
  <rect x="440" y="380" width="136" height="42" rx="8" fill="#F2F5F3"/>
  <rect x="588" y="380" width="90" height="42" rx="8" fill="#F2F5F3"/>
  <rect x="440" y="434" width="108" height="42" rx="8" fill="#F2F5F3"/>
  <rect x="560" y="434" width="118" height="42" rx="8" fill="#F2F5F3"/>
  <text x="493" y="352" text-anchor="middle" class="label">FAIRS</text>
  <text x="618" y="352" text-anchor="middle" class="label">DIRECTORIES</text>
  <text x="508" y="406" text-anchor="middle" class="label">MARKETPLACES</text>
  <text x="633" y="406" text-anchor="middle" class="label">WEB</text>
  <text x="494" y="460" text-anchor="middle" class="label">COMPANY</text>
  <text x="619" y="460" text-anchor="middle" class="label">SOCIAL</text>
  <path d="M440 520h238" stroke="#DCE5E1"/>
  <text x="440" y="555" class="body">Names found across sources</text>

  <circle cx="800" cy="274" r="20" fill="#367764"/>
  <text x="800" y="280" text-anchor="middle" class="num">03</text>
  <text x="832" y="282" class="card-title">Verify</text>
  <circle cx="800" cy="343" r="12" fill="#DCECE6"/>
  <circle cx="800" cy="393" r="12" fill="#DCECE6"/>
  <circle cx="800" cy="443" r="12" fill="#DCECE6"/>
  <circle cx="800" cy="493" r="12" fill="#DCECE6"/>
  <path d="M794 343l4 4 8-9M794 393l4 4 8-9M794 443l4 4 8-9M794 493l4 4 8-9" stroke="#28705B" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="826" y="349" class="body">Identity and market</text>
  <text x="826" y="399" class="body">Buyer or user signal</text>
  <text x="826" y="449" class="body">Offer fit and recency</text>
  <text x="826" y="499" class="body">Sourced contact route</text>
  <text x="784" y="555" class="label">DEDUPLICATED · EVIDENCE SAVED</text>

  <circle cx="1144" cy="274" r="20" fill="#DFA66D"/>
  <text x="1144" y="280" text-anchor="middle" class="num">04</text>
  <text x="1176" y="282" fill="#FFFFFF" font-size="25" font-weight="700">Deliver</text>
  <rect x="1128" y="326" width="216" height="154" rx="12" fill="#214C40" stroke="#3D665B"/>
  <text x="1150" y="357" fill="#BFD8CF" font-size="13" font-weight="750" letter-spacing=".8">PROSPECT P-014</text>
  <text x="1150" y="392" fill="#FFFFFF" font-size="18" font-weight="650">Qualified contact</text>
  <path d="M1150 416h170M1150 440h142" stroke="#6A8B81" stroke-width="2" stroke-linecap="round"/>
  <rect x="1150" y="454" width="84" height="10" rx="5" fill="#DFA66D"/>
  <text x="1128" y="525" fill="#DCECE6" font-size="17">Best route + reason</text>
  <text x="1128" y="555" fill="#DCECE6" font-size="17">Tailored draft if requested</text>

  <rect x="72" y="632" width="1296" height="1" fill="#D1DCD7"/>
  <text x="72" y="670" fill="#617169" font-size="15">DISCOVERY FINDS NAMES</text>
  <text x="1262" y="670" text-anchor="end" fill="#357061" font-size="15" font-weight="750">EVIDENCE EARNS THE SHORTLIST</text>
</svg>
