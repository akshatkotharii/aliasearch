<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Aliasearch workflow</title>
  <desc id="desc">Find buyer companies across exhibitions, directories, websites and public social profiles; merge duplicates; verify fit; prepare a tailored unsent outreach draft.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l5 3-5 3" fill="none" stroke="#71848C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .ink { fill: #26343A; }
      .muted { fill: #68777E; }
      .blue { fill: #4F7184; }
      .rust { fill: #B86D50; }
      .panel { fill: #FCFCFA; stroke: #D9DEDA; stroke-width: 1.5; }
      .tile { fill: #FFFFFF; stroke: #D9DEDA; stroke-width: 1.4; }
      .line { fill: none; stroke: #92A1A5; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="640" fill="#F6F5F1"/>
  <text x="64" y="76" class="ink" font-size="38" font-weight="650">From discovery to a relevant first contact</text>
  <text x="66" y="116" class="muted" font-size="18" font-weight="600" letter-spacing="1.7">DISCOVER  /  DEDUPLICATE  /  QUALIFY  /  PERSONALIZE</text>

  <!-- Equal panels with consistent padding -->
  <rect x="64" y="160" width="340" height="420" rx="8" class="panel"/>
  <rect x="444" y="160" width="340" height="420" rx="8" class="panel"/>
  <rect x="824" y="160" width="340" height="420" rx="8" class="panel"/>
  <rect x="1204" y="160" width="332" height="420" rx="8" class="panel"/>
  <path d="M408 370h28M788 370h28M1168 370h28" class="line" marker-end="url(#arrow)"/>

  <!-- 1: Find sources -->
  <circle cx="96" cy="206" r="18" fill="#4F7184"/>
  <text x="96" y="213" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">1</text>
  <text x="128" y="214" class="ink" font-size="28" font-weight="650">Find sources</text>
  <path d="M84 244h300" stroke="#E2E5E1" stroke-width="1.5"/>

  <rect x="84" y="272" width="140" height="118" rx="5" class="tile"/>
  <path d="M105 322h40v31h-40zM100 322l25-18 25 18M114 332v21M136 332v21" class="line"/>
  <text x="104" y="374" class="ink" font-size="21" font-weight="600">Exhibitions</text>

  <rect x="244" y="272" width="140" height="118" rx="5" class="tile"/>
  <path d="M266 303h34v49h-34zM273 314h20M273 324h20M273 334h16M273 344h18" class="line"/>
  <text x="264" y="374" class="ink" font-size="21" font-weight="600">Directories</text>

  <rect x="84" y="408" width="140" height="118" rx="5" class="tile"/>
  <rect x="105" y="434" width="40" height="30" rx="2" class="line"/>
  <path d="M106 442h38M112 450h11M128 450h11M112 458h27" class="line"/>
  <text x="104" y="510" class="ink" font-size="21" font-weight="600">Websites</text>

  <rect x="244" y="408" width="140" height="118" rx="5" class="tile"/>
  <circle cx="277" cy="448" r="14" fill="#DCE6E8"/>
  <circle cx="277" cy="444" r="4" fill="#4F7184"/>
  <path d="M268 455c2-7 16-7 18 0M301 440h40M301 450h45M301 460h33" class="line"/>
  <text x="264" y="510" class="ink" font-size="21" font-weight="600">Public social</text>

  <!-- 2: Merge duplicates -->
  <circle cx="476" cy="206" r="18" fill="#4F7184"/>
  <text x="476" y="213" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">2</text>
  <text x="508" y="214" class="ink" font-size="28" font-weight="650">Merge duplicates</text>
  <path d="M464 244h300" stroke="#E2E5E1" stroke-width="1.5"/>

  <rect x="464" y="293" width="132" height="66" rx="5" class="tile"/>
  <circle cx="486" cy="326" r="10" fill="#DCE6E8"/>
  <path d="M482 326h8M486 322v8" class="line"/>
  <text x="506" y="332" class="ink" font-size="19" font-weight="600">Record A</text>
  <rect x="464" y="389" width="132" height="66" rx="5" class="tile"/>
  <circle cx="486" cy="422" r="10" fill="#EEDFD7"/>
  <path d="M482 422h8M486 418v8" class="line"/>
  <text x="506" y="428" class="ink" font-size="19" font-weight="600">Record B</text>
  <path d="M596 326h26v96h20M596 422h26M642 374h13" class="line" marker-end="url(#arrow)"/>
  <rect x="656" y="330" width="108" height="88" rx="5" fill="#FFFFFF" stroke="#BFCBC7" stroke-width="1.5"/>
  <rect x="656" y="330" width="108" height="8" fill="#4F7184"/>
  <path d="M673 360h74M673 377h54M673 394h66" class="line"/>
  <text x="614" y="479" class="blue" font-size="20" font-weight="650">One company</text>

  <!-- 3: Qualify -->
  <circle cx="856" cy="206" r="18" fill="#4F7184"/>
  <text x="856" y="213" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">3</text>
  <text x="888" y="214" class="ink" font-size="28" font-weight="650">Verify buyer fit</text>
  <path d="M844 244h300" stroke="#E2E5E1" stroke-width="1.5"/>

  <rect x="844" y="282" width="300" height="54" rx="5" class="tile"/>
  <circle cx="875" cy="309" r="11" fill="#DCE6E8"/>
  <path d="M870 309l4 4 7-8" fill="none" stroke="#426D7F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="901" y="316" class="ink" font-size="21">Buyer role</text>

  <rect x="844" y="352" width="300" height="54" rx="5" class="tile"/>
  <circle cx="875" cy="379" r="11" fill="#DCE6E8"/>
  <path d="M870 379l4 4 7-8" fill="none" stroke="#426D7F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="901" y="386" class="ink" font-size="21">Offer fit</text>

  <rect x="844" y="422" width="300" height="54" rx="5" class="tile"/>
  <circle cx="875" cy="449" r="11" fill="#DCE6E8"/>
  <path d="M870 449l4 4 7-8" fill="none" stroke="#426D7F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="901" y="456" class="ink" font-size="21">Market + contact route</text>

  <!-- 4: Prepare contact -->
  <circle cx="1236" cy="206" r="18" fill="#4F7184"/>
  <text x="1236" y="213" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">4</text>
  <text x="1268" y="214" class="ink" font-size="28" font-weight="650">Prepare contact</text>
  <path d="M1224 244h292" stroke="#E2E5E1" stroke-width="1.5"/>

  <rect x="1224" y="272" width="292" height="254" rx="5" fill="#FFFFFF" stroke="#D9DEDA" stroke-width="1.5"/>
  <rect x="1224" y="272" width="292" height="48" fill="#E8EEF0"/>
  <path d="M1245 290l14 10 14-10M1245 290v18h28v-18" class="line"/>
  <text x="1288" y="303" class="ink" font-size="18" font-weight="600">Tailored draft · unsent</text>
  <path d="M1248 356h244M1248 382h226M1248 408h238M1248 434h196" class="line"/>
  <rect x="1248" y="466" width="146" height="38" rx="19" fill="#E4EDF0"/>
  <text x="1321" y="491" text-anchor="middle" class="blue" font-size="16" font-weight="650">Contact route</text>
  <rect x="1405" y="466" width="82" height="38" rx="19" fill="#F2E7DF"/>
  <text x="1446" y="491" text-anchor="middle" class="rust" font-size="16" font-weight="650">Email</text>
</svg>
