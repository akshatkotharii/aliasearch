<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img" aria-labelledby="title desc">
  <title id="title">Aliasearch customer research workflow</title>
  <desc id="desc">Discover companies across exhibitions, directories, company websites and public social profiles. Deduplicate and preserve evidence, verify buyer fit, then prepare a personalized unsent outreach draft.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l5 3-5 3" fill="none" stroke="#73848B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .ink { fill: #26343A; }
      .muted { fill: #68777E; }
      .blue { fill: #4F7184; }
      .rust { fill: #B86D50; }
      .card { fill: #FCFCFA; stroke: #D9DEDA; stroke-width: 1.5; }
      .line { fill: none; stroke: #9AA7A9; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="660" fill="#F6F5F1"/>
  <text x="64" y="74" class="ink" font-size="36" font-weight="650">From discovery to a relevant first contact</text>
  <text x="66" y="112" class="muted" font-size="18" font-weight="600" letter-spacing="1.6">FIND SOURCES  /  VERIFY EVIDENCE  /  CHECK FIT  /  PREPARE A DRAFT</text>

  <!-- Four evenly spaced stages -->
  <rect x="64" y="158" width="340" height="430" rx="8" class="card"/>
  <rect x="444" y="158" width="340" height="430" rx="8" class="card"/>
  <rect x="824" y="158" width="340" height="430" rx="8" class="card"/>
  <rect x="1204" y="158" width="332" height="430" rx="8" class="card"/>

  <path d="M408 373h27M788 373h27M1168 373h27" class="line" marker-end="url(#arrow)"/>

  <!-- Stage 1 -->
  <circle cx="94" cy="202" r="17" fill="#4F7184"/>
  <text x="94" y="208" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">01</text>
  <text x="124" y="209" class="ink" font-size="24" font-weight="650">Find companies</text>
  <path d="M84 237h300" stroke="#E2E5E1" stroke-width="1.5"/>

  <rect x="84" y="262" width="140" height="126" rx="5" fill="#FFFFFF" stroke="#D9DEDA"/>
  <path d="M105 309h40v31h-40zM100 309l25-18 25 18M114 319v21M136 319v21" class="line"/>
  <text x="104" y="368" class="ink" font-size="18" font-weight="600">Exhibitions</text>

  <rect x="244" y="262" width="140" height="126" rx="5" fill="#FFFFFF" stroke="#D9DEDA"/>
  <path d="M266 291h34v47h-34zM273 302h20M273 311h20M273 320h16M273 329h18" class="line"/>
  <text x="264" y="368" class="ink" font-size="18" font-weight="600">Directories</text>

  <rect x="84" y="406" width="140" height="126" rx="5" fill="#FFFFFF" stroke="#D9DEDA"/>
  <rect x="105" y="432" width="40" height="30" rx="2" class="line"/>
  <path d="M106 440h38M112 448h11M128 448h11M112 456h27" class="line"/>
  <text x="104" y="512" class="ink" font-size="18" font-weight="600">Company sites</text>

  <rect x="244" y="406" width="140" height="126" rx="5" fill="#FFFFFF" stroke="#D9DEDA"/>
  <circle cx="277" cy="446" r="14" fill="#DCE6E8"/>
  <circle cx="277" cy="442" r="4" fill="#4F7184"/>
  <path d="M268 453c2-7 16-7 18 0M301 438h40M301 448h45M301 458h33" class="line"/>
  <text x="264" y="512" class="ink" font-size="18" font-weight="600">Public social</text>

  <!-- Stage 2 -->
  <circle cx="474" cy="202" r="17" fill="#4F7184"/>
  <text x="474" y="208" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">02</text>
  <text x="504" y="209" class="ink" font-size="24" font-weight="650">Deduplicate</text>
  <path d="M464 237h300" stroke="#E2E5E1" stroke-width="1.5"/>
  <text x="464" y="270" class="muted" font-size="16">Keep evidence with each company</text>

  <rect x="464" y="294" width="126" height="66" rx="4" fill="#FFFFFF" stroke="#D9DEDA"/>
  <circle cx="482" cy="316" r="7" fill="#DCE6E8"/>
  <text x="497" y="321" class="ink" font-size="16" font-weight="600">Candidate A</text>
  <path d="M480 340h90" class="line"/>

  <rect x="464" y="388" width="126" height="66" rx="4" fill="#FFFFFF" stroke="#D9DEDA"/>
  <circle cx="482" cy="410" r="7" fill="#EEDFD7"/>
  <text x="497" y="415" class="ink" font-size="16" font-weight="600">Candidate B</text>
  <path d="M480 434h90" class="line"/>

  <path d="M590 327h24v94h15M590 421h24v0M629 374h14" class="line" marker-end="url(#arrow)"/>
  <rect x="647" y="330" width="116" height="94" rx="4" fill="#FFFFFF" stroke="#BFCBC7" stroke-width="1.5"/>
  <rect x="647" y="330" width="116" height="8" fill="#4F7184"/>
  <text x="661" y="365" class="ink" font-size="16" font-weight="650">One company</text>
  <circle cx="665" cy="387" r="3" fill="#B86D50"/>
  <path d="M675 387h72M661 403h86" class="line"/>
  <text x="464" y="500" class="rust" font-size="16" font-weight="600">Duplicates do not inflate the count</text>

  <!-- Stage 3 -->
  <circle cx="854" cy="202" r="17" fill="#4F7184"/>
  <text x="854" y="208" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">03</text>
  <text x="884" y="209" class="ink" font-size="24" font-weight="650">Verify buyer fit</text>
  <path d="M844 237h300" stroke="#E2E5E1" stroke-width="1.5"/>
  <text x="844" y="270" class="muted" font-size="16">Check evidence against the brief</text>

  <rect x="844" y="294" width="300" height="48" rx="4" fill="#FFFFFF" stroke="#D9DEDA"/>
  <circle cx="869" cy="318" r="10" fill="#DCE6E8"/>
  <path d="M864 318l4 4 7-8" fill="none" stroke="#426D7F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="892" y="324" class="ink" font-size="18">Buyer role</text>

  <rect x="844" y="354" width="300" height="48" rx="4" fill="#FFFFFF" stroke="#D9DEDA"/>
  <circle cx="869" cy="378" r="10" fill="#DCE6E8"/>
  <path d="M864 378l4 4 7-8" fill="none" stroke="#426D7F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="892" y="384" class="ink" font-size="18">Offer fit</text>

  <rect x="844" y="414" width="300" height="48" rx="4" fill="#FFFFFF" stroke="#D9DEDA"/>
  <circle cx="869" cy="438" r="10" fill="#DCE6E8"/>
  <path d="M864 438l4 4 7-8" fill="none" stroke="#426D7F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="892" y="444" class="ink" font-size="18">Market + contact route</text>
  <text x="844" y="506" class="rust" font-size="16" font-weight="600">Return fewer if fewer qualify</text>

  <!-- Stage 4 -->
  <circle cx="1234" cy="202" r="17" fill="#4F7184"/>
  <text x="1234" y="208" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">04</text>
  <text x="1264" y="209" class="ink" font-size="24" font-weight="650">Tailor first contact</text>
  <path d="M1224 237h292" stroke="#E2E5E1" stroke-width="1.5"/>

  <rect x="1224" y="262" width="292" height="260" rx="5" fill="#FFFFFF" stroke="#D9DEDA"/>
  <rect x="1224" y="262" width="292" height="42" fill="#E8EEF0"/>
  <circle cx="1243" cy="283" r="4" fill="#8BA0A6"/>
  <circle cx="1257" cy="283" r="4" fill="#8BA0A6"/>
  <circle cx="1271" cy="283" r="4" fill="#8BA0A6"/>
  <text x="1290" y="289" class="ink" font-size="16" font-weight="600">Draft · not sent</text>
  <text x="1244" y="337" class="muted" font-size="15" font-weight="600">TO</text>
  <path d="M1272 333h223" class="line"/>
  <text x="1244" y="373" class="muted" font-size="15" font-weight="600">SUBJECT</text>
  <path d="M1315 369h180M1244 402h251M1244 420h235M1244 438h244" class="line"/>
  <rect x="1244" y="464" width="146" height="34" rx="17" fill="#E4EDF0"/>
  <text x="1317" y="486" text-anchor="middle" class="blue" font-size="14" font-weight="650">Best contact route</text>
  <rect x="1402" y="464" width="82" height="34" rx="17" fill="#F2E7DF"/>
  <text x="1443" y="486" text-anchor="middle" class="rust" font-size="15" font-weight="650">Email</text>

  <text x="64" y="626" class="muted" font-size="16">Each draft uses a verified company signal and a relevant offer angle.</text>
</svg>
